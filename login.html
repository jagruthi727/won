<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storage Portal Login</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><div class="logo">&#9729;</div>CloudStore <small>(Storage Management Portal)</small></div></header>
<div class="login-wrap"><div class="login">
<h1>Storage Portal Login</h1>
<form class="bd" id="f" autocomplete="off">
<div class="field"><input type="text" id="u" placeholder="Username"><button type="button" tabindex="-1">&#128100;</button></div>
<div class="field"><input type="password" id="p" placeholder="Password"><button type="button" id="eye" title="Show password">&#128065;</button></div>
<div class="cap"><canvas id="cv" width="280" height="62"></canvas><button type="button" id="rf" title="New captcha">&#10227;</button></div>
<input type="text" id="c" placeholder="Enter CAPTCHA shown above" style="margin-bottom:12px">
<p class="err" id="e"></p>
<div style="text-align:right"><button class="btn" type="submit">Submit</button></div>
</form>
<div class="links"><a href="#">Forgot Password</a><a href="#">Forgot Login ID</a><a class="home" href="#">Go to Home Page</a></div>
</div></div>
<div class="foot">Copyright &copy; 2026 CloudStore Storage Management. All rights reserved.</div>
<script src="login.js"></script></body></html>
